<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="ESPHome GPIO pinout">
  <!-- Editor title action, dark themes. Renders at 16px: the 24 viewBox with a
       1.5 stroke lands on 1px lines. Pin status is the pin's own colour (as in
       the marketplace icon) rather than a dot stacked on the pin, which blurred
       into a blob at this size. -->
  <g fill="none" stroke="#C5C5C5" stroke-width="1.5" stroke-linecap="round">
    <rect x="7.5" y="4.5" width="9" height="15" rx="2.25"/>
    <path d="M4.5 12h3M16.5 12h3M4.5 15.75h3"/>
  </g>
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M4.5 8.25h3" stroke="#4ec97a"/>
    <path d="M16.5 8.25h3" stroke="#e0a33a"/>
    <path d="M16.5 15.75h3" stroke="#e06c6c"/>
  </g>
  <rect x="10.5" y="10.5" width="3" height="3" rx="0.9" fill="#C5C5C5"/>
</svg>
