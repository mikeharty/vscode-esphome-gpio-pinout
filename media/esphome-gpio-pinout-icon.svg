<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ESPHome GPIO Pinout icon">
  <!--
    Master for the marketplace icon; rendered to the 512/128 PNGs with the
    rsvg-convert command documented in DEVELOPMENT.md ("Regenerating images").

    The constraint that drives every choice here is that the marketplace shows
    this at 32-90px. So the icon is only four shape classes - tile, chip, die,
    pins - with no feature thinner than 30px at 512 (~2px at 32px), and pin
    status is carried by the pin's own colour instead of a separate status dot.
    An earlier version stacked glow dots on top of the pins and drew the chip in
    near-background navy; both turned to mush below ~64px.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223357"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF2FA"/>
      <stop offset="1" stop-color="#C6D3E8"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <!-- rim: keeps the silhouette from dissolving into a dark marketplace card -->
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#7E95C4" stroke-opacity="0.22" stroke-width="8"/>

  <!-- pins: colour is the pin status (green used, amber warning, red conflict,
       steel free). Gaps (22) are wider than nothing and the pins (30) stay
       distinct when the icon is scaled to a third of its size. -->
  <g>
    <rect x="80" y="163" width="88" height="30" rx="7" fill="#3DD68C"/>
    <rect x="80" y="215" width="88" height="30" rx="7" fill="#7F94B8"/>
    <rect x="80" y="267" width="88" height="30" rx="7" fill="#7F94B8"/>
    <rect x="80" y="319" width="88" height="30" rx="7" fill="#7F94B8"/>

    <rect x="344" y="163" width="88" height="30" rx="7" fill="#F5A623"/>
    <rect x="344" y="215" width="88" height="30" rx="7" fill="#7F94B8"/>
    <rect x="344" y="267" width="88" height="30" rx="7" fill="#7F94B8"/>
    <rect x="344" y="319" width="88" height="30" rx="7" fill="#FF5C5C"/>
  </g>

  <!-- chip body: the one high-contrast mass that makes the icon readable at 32px -->
  <rect x="164" y="138" width="184" height="236" rx="34" fill="url(#chip)" stroke="#0B1220" stroke-width="10"/>

  <!-- die -->
  <rect x="212" y="212" width="88" height="88" rx="23" fill="#1B2740"/>
</svg>
