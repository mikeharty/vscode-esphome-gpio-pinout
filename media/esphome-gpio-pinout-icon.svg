<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ESPHome GPIO Pinout icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182234"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33415a"/>
      <stop offset="1" stop-color="#232e42"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3850"/>
      <stop offset="1" stop-color="#1d2739"/>
    </linearGradient>
    <radialGradient id="glow-g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5f56" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5f56" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="97" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>

  <!-- faint pcb grid -->
  <g stroke="#8fa5c9" stroke-opacity="0.07" stroke-width="3">
    <path d="M104 0V512M408 0V512M0 104H512M0 408H512"/>
  </g>
  <g fill="#8fa5c9" fill-opacity="0.14">
    <circle cx="104" cy="104" r="7"/>
    <circle cx="408" cy="104" r="7"/>
    <circle cx="104" cy="408" r="7"/>
    <circle cx="408" cy="408" r="7"/>
  </g>

  <!-- traces from pins -->
  <g stroke="#54688a" stroke-width="8" stroke-linecap="round" fill="none" stroke-opacity="0.55">
    <path d="M136 186H92a16 16 0 0 0-16 16v34"/>
    <path d="M376 256h48"/>
    <path d="M136 326H98"/>
    <path d="M376 186h34a16 16 0 0 1 16 16v22"/>
  </g>

  <!-- pins: left -->
  <g fill="#e3b552">
    <rect x="118" y="172" width="46" height="28" rx="14"/>
    <rect x="118" y="242" width="46" height="28" rx="14"/>
    <rect x="118" y="312" width="46" height="28" rx="14"/>
  </g>
  <!-- pins: right -->
  <g fill="#e3b552">
    <rect x="348" y="172" width="46" height="28" rx="14"/>
    <rect x="348" y="242" width="46" height="28" rx="14"/>
    <rect x="348" y="312" width="46" height="28" rx="14"/>
  </g>
  <!-- pin highlights -->
  <g fill="#f6d287" opacity="0.55">
    <rect x="122" y="176" width="38" height="8" rx="4"/>
    <rect x="122" y="246" width="38" height="8" rx="4"/>
    <rect x="122" y="316" width="38" height="8" rx="4"/>
    <rect x="352" y="176" width="38" height="8" rx="4"/>
    <rect x="352" y="246" width="38" height="8" rx="4"/>
    <rect x="352" y="316" width="38" height="8" rx="4"/>
  </g>

  <!-- chip body -->
  <rect x="152" y="128" width="208" height="256" rx="34" fill="url(#chip)" stroke="#0b101b" stroke-width="7"/>
  <rect x="158" y="134" width="196" height="244" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
  <!-- notch -->
  <circle cx="256" cy="158" r="11" fill="#141c2b"/>

  <!-- die / antenna motif -->
  <rect x="196" y="196" width="120" height="120" rx="18" fill="url(#die)" stroke="#0f1626" stroke-width="5"/>
  <g fill="none" stroke="#7ea1d6" stroke-width="9" stroke-linecap="round">
    <path d="M232 286c0-30 48-30 48 0" stroke-opacity="0.9"/>
    <path d="M216 286c0-50 80-50 80 0" stroke-opacity="0.55"/>
    <circle cx="256" cy="288" r="7" fill="#7ea1d6" stroke="none"/>
  </g>

  <!-- status dots on pins -->
  <circle cx="141" cy="256" r="34" fill="url(#glow-g)"/>
  <circle cx="141" cy="256" r="13" fill="#2ecc71"/>
  <circle cx="371" cy="186" r="30" fill="url(#glow-a)"/>
  <circle cx="371" cy="186" r="12" fill="#f5a623"/>
  <circle cx="371" cy="326" r="30" fill="url(#glow-r)"/>
  <circle cx="371" cy="326" r="12" fill="#ff5f56"/>
</svg>
